<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ساهر هاشم — ذكاء خارق</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;900&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#0A0E1A;
    --panel:#121729;
    --panel-2:#1B2238;
    --line:#2A3350;
    --gold:#E3A94D;
    --teal:#4FB8AE;
    --ink:#EDEAE1;
    --ink-muted:#8992AC;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--void);
    color:var(--ink);
    font-family:'Tajawal', sans-serif;
    display:flex;
    flex-direction:column;
    overflow:hidden;
    position:relative;
  }
  /* starfield */
  #stars{
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background-image:
      radial-gradient(1px 1px at 10% 20%, #ffffff55 50%, transparent 51%),
      radial-gradient(1px 1px at 80% 10%, #ffffff40 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 60% 70%, #ffffff45 50%, transparent 51%),
      radial-gradient(1px 1px at 30% 80%, #ffffff35 50%, transparent 51%),
      radial-gradient(1px 1px at 90% 60%, #ffffff40 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 45% 35%, #ffffff30 50%, transparent 51%),
      radial-gradient(1px 1px at 15% 55%, #ffffff35 50%, transparent 51%);
    animation: twinkle 6s ease-in-out infinite alternate;
  }
  @keyframes twinkle{ from{opacity:.5;} to{opacity:1;} }

  header{
    position:relative; z-index:2;
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 24px;
    border-bottom:1px solid var(--line);
    background:linear-gradient(180deg, var(--panel), transparent);
  }
  .brand{ display:flex; align-items:center; gap:12px; }
  .lantern{
    width:38px; height:38px; border-radius:50%;
    background:radial-gradient(circle at 50% 45%, var(--gold), #7a5420 70%);
    box-shadow:0 0 18px 4px #E3A94D66, 0 0 3px #E3A94D;
    animation: pulse 3.2s ease-in-out infinite;
    flex-shrink:0;
  }
  @keyframes pulse{ 0%,100%{box-shadow:0 0 18px 4px #E3A94D55;} 50%{box-shadow:0 0 26px 8px #E3A94D88;} }
  .brand h1{
    font-family:'Cairo', sans-serif; font-weight:900; font-size:20px; margin:0; letter-spacing:.3px;
  }
  .brand span{ display:block; font-size:12px; color:var(--ink-muted); font-weight:500; margin-top:2px; }
  #gearBtn{
    background:var(--panel-2); border:1px solid var(--line); color:var(--ink);
    width:40px; height:40px; border-radius:12px; cursor:pointer; font-size:18px;
    display:flex; align-items:center; justify-content:center; transition:.2s;
  }
  #gearBtn:hover{ border-color:var(--gold); color:var(--gold); }

  #settings{
    position:relative; z-index:3;
    background:var(--panel); border-bottom:1px solid var(--line);
    padding:0 24px; max-height:0; overflow:hidden; transition:max-height .25s ease, padding .25s ease;
  }
  #settings.open{ max-height:220px; padding:16px 24px; }
  #settings label{ font-size:13px; color:var(--ink-muted); display:block; margin-bottom:6px; }
  #settings input{
    width:100%; max-width:480px; background:var(--void); border:1px solid var(--line);
    color:var(--ink); padding:10px 12px; border-radius:10px; font-family:'Tajawal';
  }
  #settings .row{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:8px; }
  #settings button{
    background:var(--gold); color:#1a1200; border:none; padding:10px 18px;
    border-radius:10px; font-weight:700; cursor:pointer; font-family:'Tajawal';
  }
  #settings a{ color:var(--teal); text-decoration:none; font-size:13px; }
  #settings a:hover{ text-decoration:underline; }
  #keyStatus{ font-size:12px; margin-top:4px; }

  main{
    position:relative; z-index:2;
    flex:1; overflow-y:auto; padding:24px; display:flex; flex-direction:column; gap:16px;
  }
  .msg{ display:flex; gap:10px; max-width:780px; }
  .msg.user{ align-self:flex-start; flex-direction:row-reverse; margin-inline-start:auto; }
  .msg.ai{ align-self:flex-start; }
  .avatar{
    width:34px; height:34px; border-radius:10px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; font-size:16px; font-weight:900;
  }
  .msg.ai .avatar{ background:radial-gradient(circle at 40% 35%, var(--gold), #6b4a1f); color:#1a1200; }
  .msg.user .avatar{ background:var(--panel-2); border:1px solid var(--line); color:var(--teal); }
  .bubble{
    background:var(--panel); border:1px solid var(--line); padding:12px 16px;
    border-radius:14px; line-height:1.8; font-size:15px; white-space:pre-wrap; word-break:break-word;
  }
  .msg.ai .bubble{ border-color:#3a2f18; }
  .msg.user .bubble{ background:var(--panel-2); }
  .filetag{
    display:inline-block; background:var(--void); border:1px solid var(--line);
    color:var(--teal); font-size:12px; padding:3px 10px; border-radius:20px; margin-bottom:6px;
  }
  .thinking{ display:flex; gap:5px; padding:4px 0; }
  .thinking span{
    width:7px; height:7px; border-radius:50%; background:var(--gold); opacity:.5;
    animation: bounce 1.2s infinite;
  }
  .thinking span:nth-child(2){ animation-delay:.2s; }
  .thinking span:nth-child(3){ animation-delay:.4s; }
  @keyframes bounce{ 0%,60%,100%{ transform:translateY(0); opacity:.5;} 30%{ transform:translateY(-5px); opacity:1;} }

  .welcome{
    margin:auto; text-align:center; color:var(--ink-muted); max-width:520px; padding:40px 20px;
  }
  .welcome h2{ font-family:'Cairo'; color:var(--ink); font-size:22px; margin-bottom:10px; }

  footer{
    position:relative; z-index:2;
    padding:16px 24px 20px; border-top:1px solid var(--line); background:var(--panel);
  }
  #fileChips{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:8px; }
  .chip{
    background:var(--void); border:1px solid var(--line); color:var(--teal);
    font-size:12px; padding:4px 10px; border-radius:20px; display:flex; gap:6px; align-items:center;
  }
  .chip button{ background:none; border:none; color:#c96; cursor:pointer; font-size:13px; }
  .composer{ display:flex; gap:10px; align-items:flex-end; }
  #attachBtn{
    background:var(--panel-2); border:1px solid var(--line); color:var(--ink);
    width:44px; height:44px; border-radius:12px; cursor:pointer; font-size:18px; flex-shrink:0;
  }
  #attachBtn:hover{ border-color:var(--teal); color:var(--teal); }
  #textInput{
    flex:1; background:var(--void); border:1px solid var(--line); color:var(--ink);
    padding:12px 14px; border-radius:14px; font-family:'Tajawal'; font-size:15px;
    resize:none; max-height:140px; min-height:44px;
  }
  #textInput:focus{ outline:none; border-color:var(--gold); }
  #sendBtn{
    background:var(--gold); color:#1a1200; border:none; width:44px; height:44px;
    border-radius:12px; cursor:pointer; font-size:18px; flex-shrink:0; font-weight:900;
  }
  #sendBtn:disabled{ opacity:.4; cursor:not-allowed; }
  ::-webkit-scrollbar{ width:8px; }
  ::-webkit-scrollbar-thumb{ background:var(--panel-2); border-radius:8px; }
</style>
</head>
<body>
<div id="stars"></div>

<header>
  <div class="brand">
    <div class="lantern"></div>
    <div>
      <h1>ساهر هاشم</h1>
      <span>ذكاء خارق يسهر لخدمتك</span>
    </div>
  </div>
  <button id="gearBtn" title="الإعدادات">⚙</button>
</header>

<div id="settings">
  <div class="row">
    <div style="flex:1; min-width:240px;">
      <label>مفتاح Gemini API (مجاني) 🔒 يُحفظ تلقائياً في متصفحك</label>
      <input id="apiKey" type="password" placeholder="الصق المفتاح هنا — يبدأ بـ AIza">
    </div>
    <button id="saveKey">💾 حفظ</button>
    <button id="clearKey" style="background:#2A3350;color:#E3A94D;border:1px solid #3a4060;">🗑 حذف</button>
  </div>
  <a href="https://aistudio.google.com/apikey" target="_blank">احصل على مفتاح مجاني من Google AI Studio ↗</a>
  <div id="keyStatus"></div>
</div>

<main id="chat">
  <div class="welcome" id="welcome">
    <h2>أهلاً، أنا ساهر هاشم 🏮</h2>
    <p>اسهر معايا. اسألني أي سؤال، أو ارفعلي ملف نصي أو صورة وهساعدك فيه.</p>
  </div>
</main>

<footer>
  <div id="fileChips"></div>
  <div class="composer">
    <button id="attachBtn" title="إرفاق ملف">📎</button>
    <input id="fileInput" type="file" multiple style="display:none" accept=".txt,.md,.csv,.json,image/*">
    <textarea id="textInput" rows="1" placeholder="اكتب سؤالك هنا..."></textarea>
    <button id="sendBtn">➤</button>
  </div>
</footer>

<script>
let API_KEY = localStorage.getItem('saher_api_key') || "";
let attachedFiles = []; // {name, mimeType, data (base64) or text}
let history = []; // {role:'user'|'model', parts:[...]}

const gearBtn = document.getElementById('gearBtn');
const settings = document.getElementById('settings');
const apiKeyInput = document.getElementById('apiKey');
const saveKeyBtn = document.getElementById('saveKey');
const keyStatus = document.getElementById('keyStatus');

// Pre-fill key if saved and show badge
if(API_KEY){
  apiKeyInput.value = API_KEY;
  keyStatus.style.color = '#4FB8AE';
  keyStatus.textContent = '✓ مفتاح محفوظ مسبقاً — جاهز للاستخدام';
}
const chat = document.getElementById('chat');
const welcome = document.getElementById('welcome');
const fileChips = document.getElementById('fileChips');
const attachBtn = document.getElementById('attachBtn');
const fileInput = document.getElementById('fileInput');
const textInput = document.getElementById('textInput');
const sendBtn = document.getElementById('sendBtn');

gearBtn.onclick = () => settings.classList.toggle('open');

saveKeyBtn.onclick = () => {
  API_KEY = apiKeyInput.value.trim();
  if(API_KEY){
    localStorage.setItem('saher_api_key', API_KEY);
    keyStatus.style.color = '#4FB8AE';
    keyStatus.textContent = '✓ المفتاح محفوظ تلقائياً — هيتذكره في كل مرة';
    setTimeout(() => settings.classList.remove('open'), 1200);
  } else {
    keyStatus.style.color = '#c96';
    keyStatus.textContent = 'من فضلك الصق مفتاح صحيح';
  }
};

document.getElementById('clearKey').onclick = () => {
  localStorage.removeItem('saher_api_key');
  API_KEY = "";
  apiKeyInput.value = "";
  keyStatus.style.color = '#c96';
  keyStatus.textContent = '🗑 تم حذف المفتاح المحفوظ';
};

attachBtn.onclick = () => fileInput.click();

fileInput.onchange = async (e) => {
  for(const file of e.target.files){
    if(file.type.startsWith('image/')){
      const b64 = await fileToBase64(file);
      attachedFiles.push({name:file.name, mimeType:file.type, data:b64, kind:'image'});
    } else {
      const text = await file.text();
      attachedFiles.push({name:file.name, mimeType:file.type||'text/plain', text, kind:'text'});
    }
    addChip(file.name);
  }
  fileInput.value = "";
};

function fileToBase64(file){
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result.split(',')[1]);
    r.onerror = rej;
    r.readAsDataURL(file);
  });
}

function addChip(name){
  const chip = document.createElement('div');
  chip.className = 'chip';
  chip.innerHTML = `<span>📄 ${name}</span><button>✕</button>`;
  chip.querySelector('button').onclick = () => {
    attachedFiles = attachedFiles.filter(f => f.name !== name);
    chip.remove();
  };
  fileChips.appendChild(chip);
}

textInput.addEventListener('input', () => {
  textInput.style.height = 'auto';
  textInput.style.height = Math.min(textInput.scrollHeight, 140) + 'px';
});
textInput.addEventListener('keydown', (e) => {
  if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); sendMessage(); }
});
sendBtn.onclick = sendMessage;

function addMessage(role, text, fileNames=[]){
  welcome.remove();
  const msg = document.createElement('div');
  msg.className = 'msg ' + (role === 'user' ? 'user' : 'ai');
  const tags = fileNames.map(n => `<span class="filetag">📎 ${n}</span>`).join(' ');
  msg.innerHTML = `
    <div class="avatar">${role==='user' ? '🙂' : '🏮'}</div>
    <div class="bubble">${tags ? tags + '<br>' : ''}${escapeHtml(text)}</div>`;
  chat.appendChild(msg);
  chat.scrollTop = chat.scrollHeight;
  return msg;
}

function escapeHtml(s){
  return s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
}

async function sendMessage(){
  const text = textInput.value.trim();
  if(!text && attachedFiles.length === 0) return;
  if(!API_KEY){
    alert('من فضلك افتح ⚙ الإعدادات وحط مفتاح Gemini المجاني الأول.');
    settings.classList.add('open');
    return;
  }

  const fileNames = attachedFiles.map(f => f.name);
  addMessage('user', text || '(ملف بدون نص)', fileNames);

  // Build parts for this turn
  const parts = [];
  let combinedText = text;
  for(const f of attachedFiles){
    if(f.kind === 'text'){
      combinedText += `\n\n--- محتوى الملف: ${f.name} ---\n${f.text}`;
    }
  }
  if(combinedText) parts.push({text: combinedText});
  for(const f of attachedFiles){
    if(f.kind === 'image'){
      parts.push({inlineData:{mimeType:f.mimeType, data:f.data}});
    }
  }

  history.push({role:'user', parts});
  textInput.value = ""; textInput.style.height = 'auto';
  attachedFiles = []; fileChips.innerHTML = "";

  const thinkingMsg = addMessage('ai', '');
  thinkingMsg.querySelector('.bubble').innerHTML = '<div class="thinking"><span></span><span></span><span></span></div>';
  sendBtn.disabled = true;

  try{
    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent`, {
      method:'POST',
      headers:{'Content-Type':'application/json', 'x-goog-api-key': API_KEY},
      body: JSON.stringify({
        contents: history,
        systemInstruction:{parts:[{text:"أنت 'ساهر هاشم'، مساعد ذكاء اصطناعي خارق باللغة العربية، محترف، دقيق، ومباشر. ساعد المستخدم في أي مهمة يطلبها بأفضل شكل ممكن."}]}
      })
    });
    const data = await res.json();
    if(!res.ok){
      throw new Error(data.error?.message || 'حدث خطأ في الاتصال');
    }
    const reply = data.candidates?.[0]?.content?.parts?.map(p=>p.text).join('') || 'معلش، مقدرتش أفهم الرد.';
    thinkingMsg.querySelector('.bubble').textContent = reply;
    history.push({role:'model', parts:[{text:reply}]});
  } catch(err){
    thinkingMsg.querySelector('.bubble').textContent = '⚠ ' + err.message + ' — تأكد من صحة المفتاح واتصالك بالإنترنت.';
  } finally {
    sendBtn.disabled = false;
    chat.scrollTop = chat.scrollHeight;
  }
}
</script>
</body>
</html>
