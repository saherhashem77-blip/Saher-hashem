<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المجموعة القانونية لإدارة الشركات — أرشيف المستندات</title>
<style>
:root{
  --ink:#0E2136; --ink-2:#152C46; --ink-3:#1C3B5C;
  --gold:#AD8A3E; --gold-light:#D8BA72; --gold-dim:#8C7133;
  --paper:#F5F1E6; --paper-2:#FFFFFF; --paper-3:#EFE9D8;
  --text:#1C2430; --text-muted:#657085; --line:#E1D9C2; --line-2:#2A4664;
  --danger:#9C3B3B; --danger-light:#F6E4E2; --success:#3C7A56; --success-light:#E4F1E9;
  --shadow:0 10px 30px -12px rgba(14,33,54,.28);
  --radius:14px;
  --font: "Segoe UI","Tahoma","Geneva",Arial,sans-serif;
  --font-display: "Times New Roman", Georgia, "Segoe UI", serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--font);
  background:var(--paper);
  color:var(--text);
  min-height:100vh;
  direction:rtl;
  -webkit-font-smoothing:antialiased;
}
body::before{
  content:"";
  position:fixed; inset:0; pointer-events:none; z-index:0;
  background-image:
    radial-gradient(circle at 100% 0%, rgba(173,138,62,.06), transparent 40%),
    radial-gradient(circle at 0% 100%, rgba(14,33,54,.05), transparent 40%);
}
#app{position:relative; z-index:1; min-height:100vh;}
a{color:inherit;}
button{font-family:inherit;}
::selection{background:var(--gold-light); color:var(--ink);}

/* ---------- Scrollbar ---------- */
::-webkit-scrollbar{width:10px; height:10px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:#D8CFAF; border-radius:8px;}

/* ---------- Seal / emblem ---------- */
.seal{display:inline-flex; align-items:center; justify-content:center;}
.seal svg{display:block;}

/* ---------- Login screens ---------- */
.login-wrap{
  min-height:100vh; display:flex; align-items:center; justify-content:center;
  padding:32px 16px;
  background:
    radial-gradient(ellipse at 50% -10%, #1C3B5C 0%, #0E2136 55%, #0A1626 100%);
}
.login-card{
  width:100%; max-width:440px;
  background:var(--paper-2);
  border-radius:20px;
  box-shadow:0 30px 70px -20px rgba(0,0,0,.55);
  padding:40px 36px 34px;
  text-align:center;
  border:1px solid rgba(173,138,62,.25);
  animation:riseIn .55s cubic-bezier(.2,.8,.2,1);
}
@keyframes riseIn{from{opacity:0; transform:translateY(18px);} to{opacity:1; transform:translateY(0);}}
.login-card .seal{margin-bottom:14px;}
.brand-title{
  font-family:var(--font-display);
  font-size:22px; font-weight:700; color:var(--ink);
  margin:6px 0 2px; letter-spacing:.2px;
}
.brand-sub{
  font-size:13px; color:var(--gold-dim); font-weight:600;
  letter-spacing:.5px; margin-bottom:2px;
}
.brand-tagline{
  font-size:12.5px; color:var(--text-muted); margin-bottom:22px; line-height:1.7;
}
.brand-super{
  font-size:12px; color:var(--text-muted); margin-top:22px; line-height:1.8;
  border-top:1px dashed var(--line); padding-top:14px;
}
.brand-super b{color:var(--ink);}
.field{text-align:right; margin-bottom:14px;}
.field label{display:block; font-size:12.5px; color:var(--text-muted); margin-bottom:6px; font-weight:600;}
.field input, .field select, .field textarea{
  width:100%; padding:11px 13px; border-radius:10px; border:1.5px solid var(--line);
  background:#FCFAF3; font-size:14.5px; color:var(--text); font-family:inherit;
  transition:border-color .15s, box-shadow .15s;
}
.field input:focus, .field select:focus, .field textarea:focus{
  outline:none; border-color:var(--gold); box-shadow:0 0 0 3px rgba(173,138,62,.15);
}
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  padding:11px 20px; border-radius:10px; border:none; cursor:pointer;
  font-size:14.5px; font-weight:700; transition:transform .12s, box-shadow .12s, background .15s;
  font-family:inherit;
}
.btn:active{transform:translateY(1px);}
.btn-gold{background:linear-gradient(180deg,var(--gold-light),var(--gold)); color:#2B2107; box-shadow:0 8px 18px -8px rgba(173,138,62,.55);}
.btn-gold:hover{filter:brightness(1.05);}
.btn-ink{background:var(--ink); color:#fff;}
.btn-ink:hover{background:var(--ink-3);}
.btn-outline{background:transparent; border:1.5px solid var(--line); color:var(--text);}
.btn-outline:hover{border-color:var(--gold); color:var(--gold-dim);}
.btn-danger{background:var(--danger); color:#fff;}
.btn-danger:hover{filter:brightness(1.08);}
.btn-sm{padding:7px 12px; font-size:13px; border-radius:8px;}
.btn-block{width:100%;}
.btn:disabled{opacity:.5; cursor:not-allowed;}
.error-msg{background:var(--danger-light); color:var(--danger); font-size:13px; padding:9px 12px; border-radius:8px; margin-bottom:14px; text-align:right;}
.hint-line{font-size:11.5px; color:var(--text-muted); margin-top:16px;}

/* ---------- Shell ---------- */
.shell{display:flex; min-height:100vh;}
.sidebar{
  width:250px; flex-shrink:0; background:linear-gradient(180deg,var(--ink),#0A1928);
  color:#EDEBE0; display:flex; flex-direction:column; padding:22px 16px;
  position:sticky; top:0; height:100vh; overflow-y:auto;
}
.sidebar-brand{display:flex; flex-direction:column; align-items:center; text-align:center; gap:8px; padding-bottom:18px; margin-bottom:14px; border-bottom:1px solid rgba(255,255,255,.1);}
.sidebar-brand .brand-title{color:#F3EFDD; font-size:15.5px; line-height:1.5;}
.sidebar-brand .brand-sub{color:var(--gold-light); font-size:11px;}
.side-nav{display:flex; flex-direction:column; gap:4px; flex:1;}
.side-link{
  display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:10px;
  color:#C9D2DE; font-size:13.5px; cursor:pointer; text-decoration:none; border:1px solid transparent;
  transition:background .15s, color .15s;
}
.side-link:hover{background:rgba(255,255,255,.06); color:#fff;}
.side-link.active{background:rgba(173,138,62,.18); color:var(--gold-light); border-color:rgba(173,138,62,.35); font-weight:700;}
.side-link .ico{width:18px; text-align:center;}
.sidebar-foot{padding-top:14px; border-top:1px solid rgba(255,255,255,.1); font-size:11.5px; color:#8EA0B5; text-align:center;}

.main{flex:1; min-width:0; display:flex; flex-direction:column;}
.topbar{
  display:flex; align-items:center; justify-content:space-between; gap:14px;
  padding:14px 24px; background:var(--paper-2); border-bottom:1px solid var(--line);
  position:sticky; top:0; z-index:20;
}
.topbar-title{font-size:16px; font-weight:800; color:var(--ink);}
.breadcrumb{font-size:12.5px; color:var(--text-muted);}
.breadcrumb b{color:var(--gold-dim);}
.topbar-actions{display:flex; align-items:center; gap:10px;}
.user-chip{display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--text-muted); background:var(--paper-3); padding:7px 12px; border-radius:999px;}
.user-chip b{color:var(--ink);}
.iconbtn{
  width:36px; height:36px; border-radius:10px; border:1.5px solid var(--line); background:var(--paper-2);
  display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:16px; color:var(--text-muted);
  transition:all .15s;
}
.iconbtn:hover{border-color:var(--gold); color:var(--gold-dim); background:#FBF6E9;}

.content{padding:26px; flex:1;}
.page-head{margin-bottom:20px;}
.page-head h1{font-size:21px; margin:0 0 4px; color:var(--ink); font-family:var(--font-display); font-weight:700;}
.page-head p{margin:0; color:var(--text-muted); font-size:13.5px;}

/* ---------- Dashboard cards ---------- */
.stats-row{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:14px; margin-bottom:24px;}
.stat-card{background:var(--paper-2); border:1px solid var(--line); border-radius:var(--radius); padding:16px 18px; box-shadow:var(--shadow);}
.stat-num{font-size:26px; font-weight:800; color:var(--ink); font-family:var(--font-display);}
.stat-label{font-size:12px; color:var(--text-muted); margin-top:2px;}

.card-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:16px;}
.section-card{
  background:var(--paper-2); border:1px solid var(--line); border-radius:var(--radius);
  padding:20px; cursor:pointer; text-align:right; box-shadow:var(--shadow);
  transition:transform .18s, border-color .18s, box-shadow .18s; position:relative; overflow:hidden;
}
.section-card:hover{transform:translateY(-4px); border-color:var(--gold);}
.section-card::before{
  content:""; position:absolute; inset-inline-end:-30px; top:-30px; width:100px; height:100px; border-radius:50%;
  background:radial-gradient(circle, rgba(173,138,62,.15), transparent 70%);
}
.section-card .ico{font-size:26px; margin-bottom:10px; display:inline-block;}
.section-card h3{margin:0 0 6px; font-size:15.5px; color:var(--ink);}
.section-card .meta{font-size:12px; color:var(--text-muted);}
.section-card .lock{position:absolute; top:14px; left:14px; font-size:13px; color:var(--gold-dim);}
.section-card .count-pill{display:inline-block; margin-top:10px; background:var(--paper-3); color:var(--gold-dim); font-size:11.5px; padding:3px 10px; border-radius:999px; font-weight:700;}

/* ---------- Forms / panels ---------- */
.panel{background:var(--paper-2); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:20px 22px; margin-bottom:18px;}
.panel-title{font-size:15px; font-weight:800; color:var(--ink); margin:0 0 14px; display:flex; align-items:center; gap:8px;}
.form-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:14px 16px;}
.form-grid .field{margin-bottom:0;}
.form-actions{display:flex; gap:10px; margin-top:16px; justify-content:flex-start;}
.file-drop{border:1.5px dashed var(--line); border-radius:10px; padding:10px 12px; font-size:12.5px; color:var(--text-muted); background:#FCFAF3;}
.file-drop.has-file{border-color:var(--success); color:var(--success); background:var(--success-light);}

/* ---------- Toolbar / table ---------- */
.toolbar{display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:space-between; margin-bottom:14px;}
.search-box{position:relative; flex:1; min-width:220px; max-width:360px;}
.search-box input{width:100%; padding:9px 36px 9px 12px; border-radius:10px; border:1.5px solid var(--line); font-size:13.5px; background:#fff;}
.search-box .ico{position:absolute; inset-inline-end:12px; top:50%; transform:translateY(-50%); color:var(--text-muted); font-size:14px;}
.toolbar-actions{display:flex; gap:8px; flex-wrap:wrap;}

.table-wrap{overflow-x:auto; border:1px solid var(--line); border-radius:var(--radius); background:var(--paper-2);}
table.data-table{width:100%; border-collapse:collapse; font-size:13px; min-width:760px;}
table.data-table thead th{
  background:var(--ink); color:#EDEBE0; text-align:right; padding:11px 12px; font-weight:700;
  font-size:12px; white-space:nowrap; position:sticky; top:0;
}
table.data-table tbody td{padding:10px 12px; border-bottom:1px solid var(--line); vertical-align:middle; color:var(--text);}
table.data-table tbody tr:hover{background:#FBF7EC;}
table.data-table tbody tr:last-child td{border-bottom:none;}
.cell-actions{display:flex; gap:6px; white-space:nowrap;}
.qr-thumb{width:34px; height:34px; background:#fff; border:1px solid var(--line); border-radius:6px; display:flex; align-items:center; justify-content:center; cursor:pointer; padding:3px;}
.qr-thumb svg{width:100%; height:100%;}
.chip-link{color:var(--gold-dim); font-weight:700; text-decoration:none; font-size:12.5px;}
.chip-link:hover{text-decoration:underline;}
.file-btn{border:1px solid var(--line); background:#fff; border-radius:8px; padding:5px 9px; font-size:12px; cursor:pointer; color:var(--text);}
.file-btn:hover{border-color:var(--gold); color:var(--gold-dim);}
.empty-state{padding:40px 20px; text-align:center; color:var(--text-muted);}
.empty-state .ico{font-size:34px; margin-bottom:10px; display:block;}

/* ---------- Modal ---------- */
.modal-overlay{position:fixed; inset:0; background:rgba(10,20,32,.55); backdrop-filter:blur(2px); display:flex; align-items:center; justify-content:center; z-index:100; padding:20px; animation:fadeIn .18s;}
@keyframes fadeIn{from{opacity:0;} to{opacity:1;}}
.modal{background:var(--paper-2); border-radius:16px; max-width:640px; width:100%; max-height:88vh; overflow-y:auto; padding:24px; box-shadow:0 30px 70px -20px rgba(0,0,0,.5); animation:riseIn .25s;}
.modal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;}
.modal-head h3{margin:0; font-size:16px; color:var(--ink);}
.modal-close{cursor:pointer; font-size:18px; color:var(--text-muted); background:none; border:none;}
.modal-close:hover{color:var(--danger);}
.modal-file-preview img{max-width:100%; border-radius:10px; border:1px solid var(--line);}
.modal-file-preview iframe{width:100%; height:60vh; border:1px solid var(--line); border-radius:10px;}

/* ---------- Settings ---------- */
.tabs{display:flex; gap:6px; margin-bottom:18px; flex-wrap:wrap; border-bottom:1px solid var(--line);}
.tab-btn{padding:10px 16px; border:none; background:none; cursor:pointer; font-size:13.5px; font-weight:700; color:var(--text-muted); border-bottom:2.5px solid transparent; font-family:inherit;}
.tab-btn.active{color:var(--gold-dim); border-color:var(--gold);}
.list-row{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:12px 14px; border:1px solid var(--line); border-radius:10px; margin-bottom:8px; background:#fff;}
.list-row .name{font-weight:700; color:var(--ink); font-size:13.5px;}
.list-row .sub{font-size:11.5px; color:var(--text-muted);}
.badge{font-size:10.5px; background:var(--paper-3); color:var(--gold-dim); padding:2px 8px; border-radius:999px; font-weight:700; margin-inline-start:8px;}

.toast{position:fixed; bottom:22px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; padding:12px 22px; border-radius:999px; font-size:13.5px; z-index:200; box-shadow:0 10px 30px -8px rgba(0,0,0,.4); animation:riseIn .2s;}

@media(max-width:900px){
  .shell{flex-direction:column;}
  .sidebar{width:100%; height:auto; position:relative; flex-direction:row; overflow-x:auto; padding:12px;}
  .sidebar-brand{display:none;}
  .side-nav{flex-direction:row;}
  .sidebar-foot{display:none;}
  .content{padding:16px;}
}
@media print{
  .sidebar,.topbar,.toolbar,.form-actions,.cell-actions,.no-print{display:none !important;}
  body{background:#fff;}
}

</style>
</head>

/* ---------------- IndexedDB layer ---------------- */
let DB;
function openDB(){
  return new Promise((resolve,reject)=>{
    const req = indexedDB.open('LegalArchiveDB', 1);
    req.onupgradeneeded = (e)=>{
      const d = e.target.result;
      if(!d.objectStoreNames.contains('records')){
        const store = d.createObjectStore('records', { keyPath:'id', autoIncrement:true });
        store.createIndex('bySubsection','subsectionId',{unique:false});
      }
    };
    req.onsuccess = (e)=>{ DB = e.target.result; resolve(DB); };
    req.onerror = (e)=> reject(e);
  });
}
function storeTx(mode){ return DB.transaction('records', mode).objectStore('records'); }
function dbAdd(rec){ return new Promise((res,rej)=>{ const r=storeTx('readwrite').add(rec); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
function dbPut(rec){ return new Promise((res,rej)=>{ const r=storeTx('readwrite').put(rec); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
function dbDelete(id){ return new Promise((res,rej)=>{ const r=storeTx('readwrite').delete(id); r.onsuccess=()=>res(); r.onerror=()=>rej(r.error); }); }
function dbGetBySub(subId){ return new Promise((res,rej)=>{ const idx=storeTx('readonly').index('bySubsection'); const r=idx.getAll(subId); r.onsuccess=()=>res(r.result||[]); r.onerror=()=>rej(r.error); }); }
function dbGetAll(){ return new Promise((res,rej)=>{ const r=storeTx('readonly').getAll(); r.onsuccess=()=>res(r.result||[]); r.onerror=()=>rej(r.error); }); }
function dbClearAll(){ return new Promise((res,rej)=>{ const r=storeTx('readwrite').clear(); r.onsuccess=()=>res(); r.onerror=()=>rej(r.error); }); }

/* ---------------- Templates (field sets) ---------------- */
function getFieldsForTemplate(tpl){
  const fields = [ { key:'code', label:'الكود', type:'text', required:true } ];
  fields.push({ key:'date', label:'التاريخ', type:'date' });
  if(tpl==='A') fields.push({ key:'direction', label:'موجَّه أو وارد من', type:'text' });
  if(tpl==='B') fields.push({ key:'direction', label:'موجَّه أو التصنيف', type:'text' });
  if(tpl==='C'){
    fields.push(
      { key:'fileNumber', label:'رقم الملف', type:'text' },
      { key:'fileYear', label:'سنة الملف', type:'text' },
      { key:'caseNumber', label:'رقم القضية', type:'text' },
      { key:'caseYear', label:'سنة القضية', type:'text' },
      { key:'opponents', label:'الخصوم', type:'text' },
      { key:'branch', label:'الفرع', type:'text' }
    );
  }
  if(tpl==='D') fields.push({ key:'docType', label:'تصنيف المستند', type:'text' });
  fields.push(
    { key:'subject', label:'الموضوع', type:'text' },
    { key:'notes', label:'ملاحظات', type:'textarea' },
    { key:'qr', label:'QR (نص/كود يُشفَّر)', type:'text' },
    { key:'file', label:'رفع المستندات', type:'file' },
    { key:'link', label:'رابط المستندات (هايبر لينك)', type:'url' }
  );
  return fields;
}

function esc(s){
  if(s===undefined || s===null) return '';
  return String(s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function findSection(id){ return CONFIG.sections.find(s=>s.id===id); }
function findSub(sectionId, subId){ const s=findSection(sectionId); return s ? s.subsections.find(x=>x.id===subId) : null; }

}

/* ---------------- QR helper ---------------- */
function makeQR(text){
  if(!text) text=' ';
  for(let tn=1; tn<=25; tn++){
    try{
      const q = qrcode(tn,'M');
      q.addData(String(text));
      q.make();
      return q;
    }catch(e){ /* try next size */ }
  }
  return null;
}
function qrSvg(text, cell){
  cell = cell||3;
  const q = makeQR(text);
  if(!q) return '';
  return q.createSvgTag(cell, cell*2);
}

function renderRecordForm(holder, sub, fields, editingRecord){
  const isEdit = !!editingRecord;
  const rows = fields.map(f=>{
    const val = editingRecord ? (editingRecord[f.key]||'') : '';
    if(f.type==='textarea'){
      return `<div class="field"><label>${esc(f.label)}</label><textarea data-field="${f.key}" rows="2">${esc(val)}</textarea></div>`;
    }
    if(f.type==='file'){
      const info = isEdit && editingRecord.fileName ? `📎 ملف مرفق: ${esc(editingRecord.fileName)}` : 'لم يتم اختيار ملف بعد';
      return `<div class="field"><label>${esc(f.label)}</label>
        <div class="file-drop ${isEdit && editingRecord.fileName ? 'has-file':''}" id="file-drop-label">${info}</div>
        <input type="file" data-field="file" style="margin-top:6px;">
      </div>`;
    }
    const type = f.type==='date' ? 'date' : (f.type==='url' ? 'url' : 'text');
    return `<div class="field"><label>${esc(f.label)}</label><input type="${type}" data-field="${f.key}" value="${esc(val)}"></div>`;
  }).join('');

  holder.innerHTML = `
    <div class="form-grid">${rows}</div>
    <div class="form-actions">
      <button class="btn btn-gold" id="rec-save">${isEdit?'💾 حفظ التعديلات':'➕ إضافة إلى الأرشيف'}</button>
      ${isEdit ? '<button class="btn btn-outline" id="rec-cancel-edit">إلغاء التعديل</button>' : '<button class="btn btn-outline" id="rec-clear">تفريغ الحقول</button>'}
    </div>
  `;

  let pendingFile = null;
  const fileInput = holder.querySelector('input[type=file]');
  if(fileInput){
    fileInput.addEventListener('change', (e)=>{
      const f = e.target.files[0];
      if(!f) return;
      const reader = new FileReader();
      reader.onload = ()=>{
        pendingFile = { name:f.name, type:f.type, data:reader.result };
        holder.querySelector('#file-drop-label').textContent = '📎 ' + f.name;
        holder.querySelector('#file-drop-label').classList.add('has-file');
      };
      reader.readAsDataURL(f);
    });
  }

  holder.querySelector('#rec-save').addEventListener('click', async ()=>{
    const rec = isEdit ? Object.assign({}, editingRecord) : { subsectionId: sub.id, createdAt: Date.now() };
    fields.forEach(f=>{
      if(f.type==='file') return;
      const input = holder.querySelector(`[data-field="${f.key}"]`);
      if(input) rec[f.key] = input.value.trim();
    });
    if(!rec.code){ toast('الرجاء إدخال الكود على الأقل'); return; }
    if(pendingFile){ rec.fileName=pendingFile.name; rec.fileType=pendingFile.type; rec.fileData=pendingFile.data; }
    rec.updatedAt = Date.now();
    try{
      if(isEdit){ await dbPut(rec); toast('تم حفظ التعديلات ✅'); }
      else{ await dbAdd(rec); toast('تمت الإضافة إلى الأرشيف ✅'); }
      STATE.editingId = null;
      renderApp();
    }catch(err){ toast('حدث خطأ أثناء الحفظ'); }
  });

  const cancelBtn = holder.querySelector('#rec-cancel-edit');
  if(cancelBtn) cancelBtn.addEventListener('click', ()=>{ STATE.editingId=null; renderApp(); });
  const clearBtn = holder.querySelector('#rec-clear');
  if(clearBtn) clearBtn.addEventListener('click', ()=>{ renderApp(); });
}

async function renderSheetTable(holder, sub, fields){
  let rows = await dbGetBySub(sub.id);
  rows.sort((a,b)=> (a.id||0)-(b.id||0));
  if(STATE.search && STATE.search.trim()){
    const q = STATE.search.trim().toLowerCase();
    rows = rows.filter(r=> fields.some(f=> f.type!=='file' && String(r[f.key]||'').toLowerCase().includes(q)) );
  }
  if(STATE.editingId){
    const editingRecord = rows.find(r=>r.id===STATE.editingId);
    if(editingRecord){
      const formHolder = document.getElementById('rec-form-holder');
      const formTitleEl = document.getElementById('form-title');
      if(formTitleEl) formTitleEl.textContent = '✏️ تعديل سجل';
      if(formHolder) renderRecordForm(formHolder, sub, fields, editingRecord);
    }
  }
  if(rows.length===0){
    holder.innerHTML = `<div class="empty-state"><span class="ico">🗄️</span>لا توجد سجلات بعد في هذا القسم${STATE.search?' تطابق البحث':''}.</div>`;
    return;
  }
  const cols = [{key:'serial',label:'م'}].concat(fields.filter(f=>f.type!=='file').map(f=>({key:f.key,label:f.label})));
  let html = `<div class="table-wrap"><table class="data-table"><thead><tr>`;
  cols.forEach(c=> html += `<th>${esc(c.label)}</th>`);
  html += `<th>الملف</th><th>QR</th><th>إجراءات</th></tr></thead><tbody>`;
  rows.forEach((r,i)=>{
    html += `<tr>`;
    cols.forEach(c=>{
      if(c.key==='serial'){ html += `<td>${i+1}</td>`; return; }
      if(c.key==='link'){
        html += `<td>${r.link ? `<a class="chip-link" href="${esc(r.link)}" target="_blank" rel="noopener">🔗 فتح الرابط</a>` : '—'}</td>`;
        return;
      }
      html += `<td>${esc(r[c.key])||'—'}</td>`;
    });
    html += `<td>${r.fileData ? `<button class="file-btn" data-view-file="${r.id}">📄 عرض</button>` : '—'}</td>`;
    html += `<td>${ (r.qr||r.code) ? `<div class="qr-thumb" data-view-qr="${r.id}">${qrSvg(r.qr||r.code, 2.4)}</div>` : '—'}</td>`;
    html += `<td><div class="cell-actions">
      <button class="btn btn-outline btn-sm" data-edit="${r.id}">تعديل</button>
      <button class="btn btn-danger btn-sm" data-del="${r.id}">حذف</button>
    </div></td>`;
    html += `</tr>`;
  });
  html += `</tbody></table></div>`;
  holder.innerHTML = html;

  holder.querySelectorAll('[data-edit]').forEach(b=> b.addEventListener('click', ()=>{
    STATE.editingId = Number(b.getAttribute('data-edit'));
    renderApp();
    setTimeout(()=>{ const p=document.getElementById('form-title'); if(p) p.scrollIntoView({behavior:'smooth', block:'start'}); }, 30);
  }));
  holder.querySelectorAll('[data-del]').forEach(b=> b.addEventListener('click', async ()=>{
    if(!confirm('هل تريد حذف هذا السجل نهائياً؟')) return;
    await dbDelete(Number(b.getAttribute('data-del')));
    toast('تم الحذف 🗑️');
    renderApp();
  }));
  holder.querySelectorAll('[data-view-file]').forEach(b=> b.addEventListener('click', async ()=>{
    const id = Number(b.getAttribute('data-view-file'));
    const rec = rows.find(r=>r.id===id);
    openFileModal(rec);
  }));
  holder.querySelectorAll('[data-view-qr]').forEach(b=> b.addEventListener('click', ()=>{
    const id = Number(b.getAttribute('data-view-qr'));
    const rec = rows.find(r=>r.id===id);
    openQrModal(rec);
  }));
}

/* ---------------- Modals ---------------- */
function openModal(innerHtml){
  const overlay = document.createElement('div');
  overlay.className='modal-overlay';
  overlay.innerHTML = `<div class="modal">${innerHtml}</div>`;
  overlay.addEventListener('click', (e)=>{ if(e.target===overlay) overlay.remove(); });
  document.body.appendChild(overlay);
  return overlay;
}
function openFileModal(rec){
  const isImg = rec.fileType && rec.fileType.startsWith('image/');
  const isPdf = rec.fileType === 'application/pdf';
  let preview = `<p style="font-size:13px;color:var(--text-muted);">لا يمكن معاينة هذا النوع من الملفات مباشرة، يمكنك تنزيله.</p>`;
  if(isImg) preview = `<img src="${rec.fileData}" alt="">`;
  else if(isPdf) preview = `<iframe src="${rec.fileData}"></iframe>`;
  const overlay = openModal(`
    <div class="modal-head"><h3>📄 ${esc(rec.fileName||'ملف مرفق')}</h3><button class="modal-close" id="m-close">✕</button></div>
    <div class="modal-file-preview">${preview}</div>
    <div class="form-actions"><a class="btn btn-gold" href="${rec.fileData}" download="${esc(rec.fileName||'document')}">⬇️ تنزيل الملف</a></div>
  `);
  overlay.querySelector('#m-close').addEventListener('click', ()=>overlay.remove());
}
function openQrModal(rec){
  const value = rec.qr || rec.code || '';
  const overlay = openModal(`
    <div class="modal-head"><h3>QR — ${esc(rec.code||'')}</h3><button class="modal-close" id="m-close">✕</button></div>
    <div style="text-align:center;padding:10px;">
      <div style="display:inline-block;background:#fff;padding:14px;border-radius:12px;border:1px solid var(--line);">${qrSvg(value, 6)}</div>
      <p style="font-size:13px;color:var(--text-muted);margin-top:14px;">القيمة المشفّرة: <b>${esc(value)}</b></p>
      <button class="btn btn-outline btn-sm no-print" onclick="window.print()">🖨️ طباعة الملصق</button>
    </div>
  `);
  overlay.querySelector('#m-close').addEventListener('click', ()=>overlay.remove());
}

/* ---------------- CSV export ---------------- */
function exportCSV(sub, fields){
  dbGetBySub(sub.id).then(rows=>{
    if(rows.length===0){ toast('لا توجد بيانات لتصديرها'); return; }
    const cols = ['م'].concat(fields.filter(f=>f.type!=='file').map(f=>f.label));
    const lines = [cols.join(',')];
    rows.forEach((r,i)=>{
      const vals = [i+1].concat(fields.filter(f=>f.type!=='file').map(f=> csvEsc(r[f.key]) ));
      lines.push(vals.join(','));
    });
    const csv = '\uFEFF' + lines.join('\r\n');
    const blob = new Blob([csv], { type:'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = sanitizeFilename(sub.name) + '.csv';
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
    toast('تم تصدير الملف كـ CSV يفتح مباشرة في Excel');
  });
}
function csvEsc(v){
  v = v===undefined||v===null ? '' : String(v);
  if(/[",\n]/.test(v)) v = '"' + v.replace(/"/g,'""') + '"';
  return v;
}
function sanitizeFilename(s){ return String(s).replace(/[\\/:*?"<>|]/g,'-'); }
